<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AnNam Serif Showreel</title>
<style>
/* AnNam Serif v0.933 — AnNamSerif[XHGT,slnt,wght]: wght 400–700 · XHGT 0–100 · slnt 0 → −10 (default = AnNam Serif Regular) */
@font-face { font-family: "AN"; src: url("../fonts/woff2/variable/AnNamSerif[XHGT,slnt,wght].woff2") format("woff2"); font-weight: 400 700; font-style: normal; }
@font-face { font-family: "AN"; src: url("../fonts/woff2/variable/AnNamSerif-Italic[XHGT,wght].woff2") format("woff2"); font-weight: 400 700; font-style: italic; }
:root { --paper:#eae9e6; --ink:#0e0e0e; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; }
/* storyboard frame: 2034 × 1270 (Figma Đìzai Serif – WIP · Storyboard) */
#stage { position:relative; width:2034px; height:1270px; overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:"AN"; font-kerning:normal; -webkit-font-smoothing:antialiased; isolation:isolate; }
.layer { position:absolute; inset:0; overflow:hidden; }
.abs { position:absolute; }
.nw { white-space:nowrap; }
.m { position:absolute; top:0; overflow:hidden; line-height:.7; }
.m > span { display:inline-block; will-change:transform; }
.meas { position:absolute; left:0; top:0; visibility:hidden; white-space:nowrap; line-height:.7; }
.photo { position:absolute; inset:0; background-size:cover; background-position:50% 50%; }
.hud { position:absolute; inset:0; pointer-events:none; z-index:50; }
.hud > div { position:absolute; top:48px; font-size:48px; }
</style>
</head>
<body>
<div id="stage">

  <!-- A · frames 01–06: HUD + symbol + AN NAM → photo inside the letters → photo opens from the rosette → A–Z / a–z -->
  <div class="layer" id="A" style="z-index:1">
    <svg class="abs" id="sym" width="232" height="215" viewBox="0 0 232 215" style="left:901.3px;top:344.3px;overflow:visible">
      <defs>
        <path id="arcs" d="M232 41.1356C206.128 77.0198 163.795 100.423 116.001 100.423C68.2061 100.423 25.8732 77.0198 0.000732422 41.1356L58.001 0.000335693C70.9366 17.9424 92.103 29.6439 116.001 29.6439C139.898 29.6439 161.065 17.9424 174 0.000335693L232 41.1356ZM0.00103246 173.865C25.8735 137.981 68.2063 114.578 116.001 114.578C163.795 114.578 206.128 137.981 232.001 173.865L174 215C161.065 197.058 139.898 185.357 116.001 185.357C92.1033 185.357 70.9369 197.058 58.0013 215L0.00103246 173.865Z"/>
        <mask id="arcmask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="332" height="315"><use href="#arcs" fill="white" fill-rule="evenodd"/></mask>
      </defs>
      <!-- two identical arc pairs (outline = inner half of a 22 stroke, as in Figma); they turn ±67.5° into the rosette -->
      <g opacity=".22"><g id="symAe"><use href="#arcs" fill="none" stroke="currentColor" stroke-width="22" mask="url(#arcmask)"/></g></g>
      <g opacity=".22"><g id="symBe"><use href="#arcs" fill="none" stroke="currentColor" stroke-width="22" mask="url(#arcmask)"/></g></g>
      <g id="symA"><g id="symAi"><use href="#arcs" fill="none" stroke="currentColor" stroke-width="22" mask="url(#arcmask)"/></g></g>
      <g id="symB"><g id="symBi"><use href="#arcs" fill="none" stroke="currentColor" stroke-width="22" mask="url(#arcmask)"/></g></g>
    </svg>
    <div class="abs nw" id="annam"></div>
    <!-- frames 05–06: full photo, opened by a circle from the rosette's centre -->
    <div class="layer" id="pfull" style="z-index:40">
      <div class="photo" id="pfullimg" style="background-image:url(img_sb/hue.jpg)"></div>
      <div class="abs" id="az" style="left:0;top:0;width:100%;color:var(--paper)"></div>
    </div>
  </div>

  <!-- B · frame 07: Ẩ on the guide lines -->
  <div class="layer" id="B" style="z-index:2;background:var(--paper);display:none">
    <div id="glines"></div>
    <div class="abs nw" id="gA" style="font-size:797px;"></div>
    <div class="abs nw" id="gHook" style="font-size:797px;line-height:1;z-index:1"><span>Ẩ</span><span class="abs" style="left:0;top:0;color:var(--paper);-webkit-text-stroke:5px var(--paper)">Â</span></div>
    <div class="abs nw" id="gCirc" style="font-size:797px;line-height:1;z-index:2"></div>
    <div class="abs nw" id="gCyc" style="font-size:797px;line-height:1;z-index:3;display:none"></div>
  </div>

  <!-- C · frame 08: place names, roman / italic, drifting -->
  <div class="layer" id="Cn" style="z-index:3;background:var(--paper);display:none"></div>

  <!-- D · frame 09: Hà Nội Opera House photo, AN NAM / SERIF, styles -->
  <!-- E · Story-08b: "Sự học cũng như việc chèo thuyền ngược nước, không tiến ắt sẽ lùi" + boat -->
  <div class="layer" id="E" style="z-index:4;background:var(--paper);display:none">
    <img id="boat" src="img_sb/boat.png" class="abs" style="left:1295px;top:518px;width:739px;height:752px;mix-blend-mode:darken;transform-origin:40% 80%">
    <div id="elines"></div>
  </div>
  <!-- F · Story-08c: "Enfin, la guerre d'Indochine se termine. Le Vietnam est devenu une nation indépendante." -->
  <div class="layer" id="F" style="z-index:5;display:none"><div id="flines"></div></div>

  <div class="layer" id="D" style="z-index:6;display:none">
    <div class="photo" id="dimg" style="background-image:url(img_sb/opera.jpg)"></div>
    <div class="abs nw" id="dannam" style="color:var(--paper)"></div>
    <div class="abs nw" id="dserif" style="color:var(--paper)"></div>
    <div class="abs" id="dinfo" style="left:0;width:100%;top:1096px;color:var(--paper);font-size:48px;text-align:center;"></div>
  </div>

  <!-- frame 04: the whole composition becomes a window onto the photo (lighten: ink → photo, paper stays) -->
  <div class="photo" id="pin" style="background-image:url(img_sb/hue_s04.jpg);mix-blend-mode:lighten;opacity:0;z-index:60;background-size:2013px 1270px;background-position:0 0"></div>
  <div class="hud" id="hud">
    <div id="h1" style="left:48px"></div>
    <div id="h2" style="left:1017px"></div>
    <div id="h3" style="right:48px"></div>
  </div>
</div>

<script>
const W = 2034, H = 1270, FPS = 30, DUR = 12;
const C = { paper:'#eae9e6', ink:'#0e0e0e' };
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,p) => a + (b-a)*p;
const expoOut = p => p >= 1 ? 1 : 1 - Math.pow(2, -10*p);
const expoInOut = p => p<=0?0:p>=1?1: p<.5 ? Math.pow(2,20*p-10)/2 : (2-Math.pow(2,-20*p+10))/2;
const quartInOut = p => p<.5 ? 8*p*p*p*p : 1-Math.pow(-2*p+2,4)/2;
const cubicOut = p => 1 - Math.pow(1-p, 3);
function fv(el, w=400, x=0, s=0) {   // XHGT 0 = AnNam Serif
  el.style.fontVariationSettings = `"wght" ${w}, "XHGT" ${x}, "slnt" ${s}`; el.style.fontWeight = Math.round(w);
}

// ---------- kerned, masked words (each letter in its own mask, positioned by the font's own spacing + kerning)
function kernWord(host, text, opt={}) {
  host.innerHTML = '';
  const meas = document.createElement('span'); meas.className = 'meas'; meas.textContent = text; host.appendChild(meas);
  const padT = opt.padTop ?? .1, padB = opt.padBot ?? .08, padX = opt.padX ?? .14;
  const items = [];
  [...text].forEach((ch,i)=>{
    if (ch === ' ') { items.push(null); return; }
    const m = document.createElement('span'); m.className = 'm';
    m.style.padding = `${padT}em ${padX}em ${padB}em`; m.style.marginTop = `-${padT}em`;
    const s = document.createElement('span'); s.textContent = ch; m.appendChild(s); host.appendChild(m);
    items.push({m, s, i});
  });
  host.style.lineHeight = '.7';
  return { host, meas, items, padX };
}
function layoutWord(K) {
  const tn = K.meas.firstChild, r = document.createRange();
  const hostR = K.host.getBoundingClientRect();
  const sc = K.host.offsetWidth ? hostR.width / K.host.offsetWidth : 1;
  const fs = parseFloat(getComputedStyle(K.host).fontSize);
  K.items.forEach(it=>{ if (!it) return;
    r.setStart(tn, it.i); r.setEnd(tn, it.i+1);
    it.m.style.left = ((r.getBoundingClientRect().left - hostR.left) / sc - K.padX*fs) + 'px';
  });
  K.host.style.width = K.meas.offsetWidth + 'px'; K.host.style.height = K.meas.offsetHeight + 'px';
}
// in: from below (dir 1) or above (dir −1); out: leaves upwards
function slot(K, t, tin, tout=null, stagger=.03, dur=.4, dir=1) {
  K.items.forEach((it,j)=>{ if (!it) return;
    const a = expoOut(seg(t, tin + j*stagger, tin + j*stagger + dur));
    const b = tout == null ? 0 : expoInOut(seg(t, tout + j*stagger*.6, tout + j*stagger*.6 + dur*.8));
    it.s.style.transform = `translateY(${(dir*(1-a) - b)*190}%)`; });
}
// letters come forward out of the depth: far back, blurred, transparent → in place, sharp; out = recede back
function depth(K, t, tin, tout=null, stagger=.035, dur=.62) {
  const n = K.items.length;
  K.items.forEach((it,j)=>{ if (!it) return;
    const d = Math.abs(j - (n-1)/2) * stagger;                      // from the middle of the line outwards
    const a = expoOut(seg(t, tin + d, tin + d + dur));
    const b = tout == null ? 0 : Math.pow(seg(t, tout + d*.5, tout + d*.5 + .32), 1.6);
    const z = -900*(1-a) - 700*b, blur = 30*(1-a) + 26*b;
    it.s.style.transform = `perspective(1400px) translateZ(${z}px)`;
    it.s.style.filter = blur > .2 ? `blur(${blur.toFixed(1)}px)` : 'none';
    it.s.style.opacity = clamp(a*1.4) * (1 - b);
  });
}
const cx = document.createElement('canvas').getContext('2d');
function ink(text, size, weight=400, italic=false) {
  cx.font = `${italic?'italic ':''}${weight} ${size}px AN`; const m = cx.measureText(text);
  return { l:m.actualBoundingBoxLeft, r:m.actualBoundingBoxRight, a:m.actualBoundingBoxAscent, d:m.actualBoundingBoxDescent, w:m.width };
}

// ================= build =================
const imgs = ['img_sb/hue.jpg','img_sb/hue_s04.jpg','img_sb/opera.jpg','img_sb/boat.png'].map(src=>new Promise(res=>{ const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
let KS, HUD = [], KN, AZ = [], LZ = [], KA, NM = [], KD, DI = [], EL = [], FL = [];
function build() {
  // HUD (storyboard: cap 33.6 px at y 48)
  [['h1','BY ĐÌZAI STUDIO'],['h2','AN NAM SERIF'],['h3','TYPE SPECIMEN - 2026']].forEach(([id,txt])=>{ const K = kernWord($(id), txt, {padTop:.35}); fv(K.host); HUD.push(K); });
  // AN NAM: full width, cap top at y 823 (storyboard), sized so its ink spans 59 → 1988
  KN = kernWord($('annam'), 'AN NAM', {padTop:.12});
  const k = ink('AN NAM', 100); const fs = (1988 - 59) / ((k.l + k.r)/100);
  $('annam').style.fontSize = fs + 'px'; $('annam').dataset.inkl = k.l/100*fs;
  // A–Z and a–z blocks (4 centred lines, pitch 180, white)
  const up = ['ABCDEFG','HIJKLMNO','PQRSTUV','WXYZ'], lo = ['abcdefg','hijklmno','pqrstuv','wxyz'];
  [[up,AZ],[lo,LZ]].forEach(([rows,arr])=>rows.forEach((txt,i)=>{
    const d = document.createElement('div'); d.className='abs nw'; d.style.fontSize = '196px'; $('az').appendChild(d);
    const K = kernWord(d, txt, {padTop:.35, padBot:.3}); fv(d); K.items.forEach(it=>{ if (it) it.m.style.overflow = 'visible'; }); arr.push({K, i});
  }));
  // guide lines: 397 · cap 407 · x-height (font: 495 → 570) · baseline 965 · descender 1127
  [397, 407, 570, 965, 1127].forEach((y,i)=>{ const l = document.createElement('div'); l.className='abs';
    l.style.cssText = `left:0;top:${y}px;width:${W}px;height:1.5px;background:#c9c9c5;transform-origin:0 50%;`; $('glines').appendChild(l); });
  KA = kernWord($('gA'), 'A', {padTop:.05}); fv($('gA'));
  $('gCirc').textContent = 'Â'; fv($('gCirc')); fv($('gHook'));
  // place names (storyboard lines: pitch 228, roman / italic alternating)
  // old place names of An Nam (kinh đô, trấn, dinh, tỉnh thời xưa); each row far longer than the frame
  const rows = [
    ['Thăng Long','Phú Xuân','Gia Định','Hội An','Hoa Lư','Cổ Loa','Bến Nghé','Chợ Lớn','Huế','Đà Nẵng'],
    ['Định Tường','Vĩnh Long','An Giang','Hà Tiên','Biên Hòa','Phiên An','Trấn Biên','Vĩnh Thanh','Sa Đéc','Châu Đốc'],
    ['Kinh Bắc','Sơn Nam','Hải Dương','Sơn Tây','Thanh Hoa','Nghệ An','Hà Tĩnh','Quảng Bình','Quảng Trị','Thừa Thiên'],
    ['Quảng Nam','Quảng Ngãi','Bình Định','Phú Yên','Khánh Hòa','Bình Thuận','Đồng Nai','Mỹ Tho','Bà Rịa','Tây Ninh'],
    ['Cao Bằng','Lạng Sơn','Tuyên Quang','Hưng Hóa','Thái Nguyên','Nam Định','Hưng Yên','Bắc Ninh','Ninh Bình','Hải Phòng'],
  ];
  const names = rows.map((r,i)=>[(r.join(' - ') + ' - ').repeat(2), i%2===1, -700 - (i*317)%900]);
  names.forEach(([txt,it,x0],i)=>{
    const d = document.createElement('div'); d.className='abs nw';
    d.style.cssText = `font-size:212px;line-height:1.1;top:${155 + i*228 - 40}px;left:0;${it?'font-style:italic;':''}`;
    const chars = [...txt].map(ch=>{ const c = document.createElement('span'); c.textContent = ch; d.appendChild(c); return c; });
    fv(d); $('Cn').appendChild(d); NM.push({d, x0, dir: i%2 ? 1 : -1, i, chars});
  });
  // Story-08b / 08c: uppercase lines, each a row of kerned masked words; italic parts as their own host
  const mkLine = (host, parts, fs, x, y, align) => {
    const row = document.createElement('div'); row.className = 'abs'; row.style.cssText = `left:0;top:${y}px;width:${W}px;`;
    host.appendChild(row);
    const Ks = parts.map(([txt, it])=>{ const d = document.createElement('div'); d.className = 'abs nw';
      d.style.cssText = `top:0;font-size:${fs}px;${it?'font-style:italic;':''}`; row.appendChild(d);
      const K = kernWord(d, txt, {padTop:.42, padBot:.12, padX:.18}); fv(d); return K; });
    return {row, Ks, x, align};
  };
  const fitE = 1660 / (ink('SỰ HỌC CŨNG NHƯ', 100).w / 100);
  [[[['SỰ HỌC CŨNG NHƯ',0]], 48, 162, 'l'], [[['VIỆC CHÈO THUYỀN',0]], 1973, 388, 'r'], [[['NGƯỢC NƯỚC,',0]], 443, 614, 'l'],
   [[['KHÔNG',0],['TIẾN',1]], 48, 840, 'l'], [[['ẮT SẼ',0],['LÙI',1]], 443, 1066, 'l']]
    .forEach(([parts,x,y,al])=>EL.push(mkLine($('elines'), parts, fitE, x, y, al)));
  const fitF = 1447 / (ink('ENFIN, LA GUERRE', 100).w / 100);
  [['ENFIN, LA GUERRE',48,142], ["D'INDOCHINE",443,329], ['SE TERMINE.',836,516], ['LE VIETNAM EST',48,703], ['DEVENU UNE',443,890], ['NATION INDÉPENDANTE.',48,1077]]
    .forEach(([txt,x,y])=>FL.push(mkLine($('flines'), [[txt,0]], fitF, x, y, 'l')));
  // frame 09
  KD = kernWord($('dannam'), 'AN NAM', {padTop:.45}); $('dannam').style.fontSize = $('annam').style.fontSize;
  KS = kernWord($('dserif'), 'SERIF', {padTop:.45}); $('dserif').style.fontSize = $('annam').style.fontSize;
  const star = `<svg width="20" height="20" viewBox="0 0 20 20" style="display:inline-block;vertical-align:.12em;margin:0 12px"><path fill="currentColor" d="M7.33333 0H12.6667C12.4889 1.37778 12.2222 2.73333 11.8667 4.06667C11.5556 5.4 11.3333 6.68889 11.2 7.93333C12.2222 7.17778 13.2222 6.33333 14.2 5.4C15.1778 4.42222 16.2222 3.51111 17.3333 2.66667L20 7.33333C18.7556 7.86667 17.4667 8.33333 16.1333 8.73333C14.8 9.08889 13.5556 9.51111 12.4 10C13.5556 10.4889 14.8 10.9333 16.1333 11.3333C17.4667 11.6889 18.7556 12.1333 20 12.6667L17.3333 17.3333C16.2222 16.4889 15.1778 15.5778 14.2 14.6C13.2222 13.6222 12.2222 12.7778 11.2 12.0667C11.3333 13.3111 11.5556 14.6 11.8667 15.9333C12.2222 17.2667 12.4889 18.6222 12.6667 20H7.33333C7.51111 18.6222 7.75556 17.2667 8.06667 15.9333C8.42222 14.6 8.66667 13.3111 8.8 12.0667C7.82222 12.7778 6.82222 13.6222 5.8 14.6C4.82222 15.5778 3.77778 16.4889 2.66667 17.3333L0 12.6667C1.28889 12.1333 2.6 11.6889 3.93333 11.3333C5.26667 10.9333 6.48889 10.4889 7.6 10C6.48889 9.51111 5.26667 9.08889 3.93333 8.73333C2.6 8.33333 1.28889 7.86667 0 7.33333L2.66667 2.66667C3.77778 3.51111 4.82222 4.42222 5.8 5.4C6.82222 6.33333 7.82222 7.17778 8.8 7.93333C8.66667 6.68889 8.42222 5.4 8.06667 4.06667C7.75556 2.73333 7.51111 1.37778 7.33333 0Z"/></svg>`;
  ['VARIABLE', '<i>ITALIC</i>', `REGULAR${star}MEDIUM${star}SEMIBOLD${star}BOLD`].forEach((h,i)=>{
    const m = document.createElement('div'); m.style.cssText = `height:46px;overflow:hidden;line-height:34px;padding-top:2px;`;
    const s = document.createElement('div'); s.innerHTML = h; m.appendChild(s); $('dinfo').appendChild(m); DI.push(s);
  });
}

// ================= render(t) — 12 s, hard cuts on the beat (120 BPM), storyboard Story-01 … 09 =================
const rnd = (i, s=1) => { const x = Math.sin(i*127.1 + s*311.7) * 43758.5453; return x - Math.floor(x); };
const vis = (el, b) => { el.style.visibility = b ? 'visible' : 'hidden'; };
const show = (id, b) => { $(id).style.display = b ? 'block' : 'none'; };
// letters of a kerned word appear one by one, scattered (random height + weight), then all snap into the line
function scatterSnap(K, t, t0, step, tSnap, seed, range=380, base=400, dirY=-1) {
  let j = 0;
  K.items.forEach(it=>{ if (!it) return; it.m.style.overflow = 'visible';
    vis(it.s, t >= t0 + j*step);
    const free = t < tSnap;
    it.s.style.transform = free ? `translate(${(rnd(j,seed)-.5)*70}px, ${dirY*rnd(j,seed+7)*range}px)` : 'none';
    fv(it.s, free ? 400 + Math.round(rnd(j,seed+3)*3)*100 : base);
    it.s.style.filter = 'none'; it.s.style.opacity = 1;
    j++; });
}
// type-on: characters switch on one by one
// glyph roulette: each letter flicks through Vietnamese capitals of the face, then locks to its own letter (left → right)
const POOL = [...'ĂÂĐÊÔƠƯẮẰẲẴẶẤẦẨẪẬẾỀỂỄỆỐỒỔỖỘỚỜỞỠỢỨỪỬỮỰÁÀẢÃẠÉÈẺẼẸÍÌỈĨỊÓÒỎÕỌÚÙỦŨỤÝỲỶỸỴ'];
function roulette(K, t, t0, lock0, lockStep, seed) {
  let j = 0;
  K.items.forEach(it=>{ if (!it) return;
    if (it.ch == null) {
      it.ch = it.s.textContent;
      const w0 = ink(it.ch, 100).w, byW = POOL.map(g=>[g, Math.abs(ink(g, 100).w - w0)]).sort((a,b)=>a[1]-b[1]);
      it.pool = byW.filter(([g,d])=>d < .12*w0).map(([g])=>g); if (it.pool.length < 6) it.pool = byW.slice(0, 6).map(([g])=>g);
    }
    vis(it.s, t >= t0); it.s.style.transform = 'none'; it.s.style.opacity = 1; it.s.style.filter = 'none';
    const locked = t >= lock0 + j*lockStep || !/\p{L}/u.test(it.ch);
    const c = locked ? it.ch : it.pool[Math.floor(rnd(Math.floor(t*20) + j*13, seed) * it.pool.length)];
    if (it.s.textContent !== c) it.s.textContent = c;
    j++; });
}
function typeOn(K, t, t0, dt) { let j = 0; K.items.forEach(it=>{ if (!it) return; vis(it.s, t >= t0 + j*dt); it.s.style.transform = 'none'; j++; }); }
// centre a word on its actual ink (not its advance box)
function inkCentre(host, text) { const fs = parseFloat(host.style.fontSize), k = ink(text, fs); host.style.left = (W/2 - (k.r - k.l)/2) + 'px'; }
function placeLine(L) {
  let x = 0; L.Ks.forEach((K,i)=>{ layoutWord(K); if (i) x += ink(' ', parseFloat(K.host.style.fontSize)).w; K.host.style.left = x + 'px'; x += K.meas.offsetWidth; });
  const x0 = L.align === 'r' ? L.x - x : L.x;
  L.Ks.forEach(K=>{ K.host.style.left = (parseFloat(K.host.style.left) + x0) + 'px'; });
}

function render(t) {
  const sA = t < 4.5, sB = t >= 4.5 && t < 6.25, sC = t >= 6.25 && t < 7.5, sE = t >= 7.5 && t < 8.75, sF = t >= 8.75 && t < 9.75, sD = t >= 9.75;
  show('A', sA); show('B', sB); show('Cn', sC); show('E', sE); show('F', sF); show('D', sD);

  // ---------- HUD: typed on at 0.25; white over photos
  HUD.forEach((K,i)=>{ layoutWord(K); typeOn(K, t, .25 + i*.06, .018); });
  $('h2').style.transform = 'translateX(-50%)';
  $('hud').style.color = ((t >= 3.0 && t < 4.5) || sD) ? C.paper : C.ink;
  $('hud').style.zIndex = (t >= 2.25 && t < 3.0) ? 30 : 70;

  // ---------- 02–04
  const pin = $('pin');
  pin.style.opacity = (t >= 2.25 && t < 3.0 && !(t >= 2.29 && t < 2.33)) ? 1 : 0;   // hard cut, 1-frame flicker
  if (sA) {
    // symbol: cuts in on the beat; 03 → turns into the rosette in four snaps
    vis($('sym'), t >= 1.25); $('sym').style.color = C.ink; $('sym').style.transform = 'none'; $('sym').style.opacity = 1;
    const rot = 67.5 * quartInOut(seg(t, 1.5, 2.1)), prev = rot, echo = false;
    $('symAi').setAttribute('transform', `rotate(${rot} 116 107.5)`);
    $('symBi').setAttribute('transform', `rotate(${-rot} 116 107.5)`);
    $('symAe').setAttribute('transform', `rotate(${prev} 116 107.5)`);
    $('symBe').setAttribute('transform', `rotate(${-prev} 116 107.5)`);
    $('symAe').parentNode.style.display = $('symBe').parentNode.style.display = echo ? 'inline' : 'none';
    // AN NAM: scattered letters (one per 16th) snap into the line at 1.25; 03: a weight wave runs through it
    const an = $('annam'); fv(an); layoutWord(KN);
    inkCentre(an, 'AN NAM'); an.style.top = '823px';
    // smooth zoom: from a giant, cropped A (on the cut at 0.5) back to the full word
    const zp = expoOut(seg(t, .5, 1.25)), zoom = Math.exp(Math.log(7.5) * (1 - zp));   // smooth pull-back, log-scale
    const firstA = KN.items[0];
    const ox = parseFloat(firstA.m.style.left) + firstA.m.offsetWidth/2, oy = an.offsetHeight * .45;
    an.style.transformOrigin = `${ox}px ${oy}px`; an.style.transform = `scale(${t < .5 ? 1 : zoom})`;
    vis(an, t >= .5);
    KN.items.forEach(it=>{ if (it) { vis(it.s, t >= .5); it.s.style.transform = 'none'; it.s.style.filter = 'none'; it.s.style.opacity = 1; fv(it.s, 400); } });
    if (t >= 1.25) { let j = 0; KN.items.forEach(it=>{ if (!it) return;
      const x = (t - 1.75 - j*.07) / .3, w = x > 0 && x < 1 ? 400 + 300*Math.sin(Math.PI*x) : 400;
      fv(it.s, w); j++; }); }
    // 05–06: hard cut to the photo; letters come out of the depth (blur → sharp), upper → lower case
    show('pfull', t >= 3.0); $('pfull').style.clipPath = 'none';
    $('pfullimg').style.transform = `scale(${lerp(1.06, 1.0, seg(t, 3.0, 4.5))})`;
    AZ.forEach(({K,i})=>{ fv(K.host); layoutWord(K);
      K.host.style.left = (W - K.host.offsetWidth)/2 + 'px'; K.host.style.top = (300 + i*180) + 'px';
      depth(K, t, 3.05 + i*.06, 3.82 + i*.04); });
    LZ.forEach(({K,i})=>{ fv(K.host); layoutWord(K);
      K.host.style.left = (W - K.host.offsetWidth)/2 + 'px'; K.host.style.top = (300 + i*180) + 'px';
      depth(K, t, 3.98 + i*.06, null); });
  }

  // ---------- 07: guide lines; A breathes through the weight axis; marks snap on; glyphs cut cap → lower
  if (sB) {
    $('B').style.clipPath = 'none'; $('B').style.transform = 'none';
    [...$('glines').children].forEach(l=>{ l.style.transform = 'none'; });
    const fs = 797, base = 965, k = ink('A', fs), A = $('gA');
    fv(A, 400 + 300*Math.sin(Math.PI*seg(t, 4.5, 4.85))); layoutWord(KA);
    KA.items.forEach(it=>{ if (it) { it.s.style.transform = 'none'; fv(it.s, 400 + 300*Math.sin(Math.PI*seg(t, 4.5, 4.85))); } });
    A.style.left = (1017 - (k.r - k.l)/2 - k.l) + 'px'; A.style.top = (base - .71*fs) + 'px';
    [['gCirc', 4.875], ['gHook', 5.0]].forEach(([id,t0])=>{
      const e = $(id); e.style.left = A.style.left; e.style.top = (base - .86*fs) + 'px';
      const localTop = (base - .7*fs - 8) - (base - .86*fs);
      e.style.clipPath = `inset(-400px -400px ${fs - localTop}px -400px)`;
      e.style.transform = 'none'; e.style.opacity = 1; vis(e, t >= t0);
    });
    const CYC = ['Ở','Ữ','Đ','Ặ','ặ','ơ','đ','ỹ'], T0 = 5.25, STEP = .125;
    const on = t >= T0, g = $('gCyc');
    [A, $('gCirc'), $('gHook')].forEach(e=>{ if (on) vis(e, false); });
    if (!on) vis(A, true);
    show('gCyc', on);
    if (on) { const ch = CYC[Math.min(CYC.length-1, Math.floor((t - T0)/STEP))], kk = ink(ch, fs);
      g.textContent = ch; fv(g); g.style.filter = 'none'; g.style.opacity = 1; g.style.transform = 'none';
      g.style.left = (1017 - (kk.r - kk.l)/2 - kk.l) + 'px'; g.style.top = (base - .86*fs) + 'px'; }
  }

  // ---------- 08: place names — characters switch on in random order; rows drift (no gaps at either end)
  if (sC) {
    $('Cn').style.transform = 'none';
    NM.forEach(({d,x0,dir,i,chars})=>{
      d.style.transform = `translateX(${x0 + dir*(t - 6.9)*150}px)`;
      chars.forEach((c,j)=>vis(c, t >= 6.25 + rnd(j + i*997, 5) * .34));
    });
  }

  // ---------- 08b: the proverb lands word by word on the beat; the boat cuts in and rocks
  if (sE) {
    $('E').style.transform = 'none';
    let w = 0;
    EL.forEach(L=>{ placeLine(L); L.Ks.forEach(K=>{ let wi = w;
      K.items.forEach(it=>{ if (!it) { wi++; return; } const ta = 7.5 + wi*.0625; vis(it.s, t >= ta); it.s.style.transform = 'none';
        fv(it.s, t < ta + .0625 ? 700 : t < ta + .125 ? 550 : 400); });
      w = wi + 1; }); });
    vis($('boat'), t >= 7.875); $('boat').style.opacity = 1;
    $('boat').style.transform = `translateY(${Math.sin((t-7.8)*3.4)*7}px) rotate(${Math.sin((t-7.8)*2.7)*1.8}deg)`;
  }

  // ---------- 08c: the French lines type out
  if (sF) {
    $('F').style.background = C.paper;
    FL.forEach((L,i)=>{ placeLine(L); L.Ks.forEach(K=>roulette(K, t, 8.76 + i*.05, 8.9 + i*.05, .012, 11 + i)); });
  }

  // ---------- 09: hard cut to the Opera House; AN NAM / SERIF gather like the opening; the styles type on
  if (sD) {
    $('D').style.clipPath = 'none';
    $('dimg').style.transform = `scale(${lerp(1.05, 1.0, seg(t, 9.75, 12))})`;
    const dn = $('dannam'); fv(dn); layoutWord(KD);
    inkCentre(dn, 'AN NAM'); dn.style.top = '146px';
    roulette(KD, t, 9.75, 10.05, .06, 3);
    const ds = $('dserif'); fv(ds); layoutWord(KS);
    inkCentre(ds, 'SERIF'); ds.style.top = '603px';
    roulette(KS, t, 9.875, 10.3, .06, 5);
    DI.forEach((s,i)=>{ const p = seg(t, 10.62 + i*.12, 10.62 + i*.12 + .3); s.style.transform = 'none';
      s.parentNode.style.clipPath = `inset(0 ${(1 - Math.floor(p*24)/24)*100}% 0 0)`; });
  }
}

window.ready = (async () => {
  for (const f of ['400 100px AN','italic 400 100px AN'])
    await document.fonts.load(f, 'AN NAM ĐÌZAI Ẩ Ở Ữ Đ Ặ ặ ơ đ ỹ Huế Hội Định Tường Vĩnh Lư Thăng Bến Thành Khánh Bình abcdefg');
  await Promise.all(imgs); await document.fonts.ready;
  build(); render(0);
  return true;
})();
window.render = render; window.DUR = DUR; window.FPS = FPS;
if (location.search.includes('play')) window.ready.then(()=>{ const t0 = performance.now(); const loop = () => { render(((performance.now()-t0)/1000) % DUR); requestAnimationFrame(loop); }; loop(); });
</script>
