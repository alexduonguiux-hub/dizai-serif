<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AnNam Serif Showreel</title>
<style>
/* AnNam Serif v0.931 — "AnNam Serif VF": wght 400–700 · XHGT 0–100 · slnt 0 → −10 (default = AnNam Serif Regular) */
@font-face { font-family: "AN"; src: url("../fonts/woff2/variable/AnNamSerifVF[XHGT,slnt,wght].woff2") format("woff2"); font-weight: 400 700; font-style: normal; }
@font-face { font-family: "AN"; src: url("../fonts/woff2/variable/AnNamSerif-Italic[XHGT,wght].woff2") format("woff2"); font-weight: 400 700; font-style: italic; }
:root { --paper:#f3f3f1; --ink:#0e0e0e; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; }
/* storyboard frame: 2034 × 1270 (Figma Đìzai Serif – WIP · Storyboard) */
#stage { position:relative; width:2034px; height:1270px; overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:"AN"; font-kerning:normal; -webkit-font-smoothing:antialiased; isolation:isolate; }
.layer { position:absolute; inset:0; overflow:hidden; }
.abs { position:absolute; }
.nw { white-space:nowrap; }
.m { position:absolute; top:0; overflow:hidden; line-height:.7; }
.m > span { display:inline-block; will-change:transform; }
.meas { position:absolute; left:0; top:0; visibility:hidden; white-space:nowrap; line-height:.7; }
.photo { position:absolute; inset:0; background-size:cover; background-position:50% 50%; }
.hud { position:absolute; inset:0; pointer-events:none; z-index:50; }
.hud > div { position:absolute; top:48px; font-size:48px; }
</style>
</head>
<body>
<div id="stage">

  <!-- A · frames 01–06: HUD + symbol + AN NAM → photo inside the letters → photo opens from the rosette → A–Z / a–z -->
  <div class="layer" id="A" style="z-index:1">
    <svg class="abs" id="sym" width="232" height="215" viewBox="0 0 232 215" style="left:901.3px;top:344.3px;overflow:visible">
      <defs>
        <path id="arcs" d="M232 41.1356C206.128 77.0198 163.795 100.423 116.001 100.423C68.2061 100.423 25.8732 77.0198 0.000732422 41.1356L58.001 0.000335693C70.9366 17.9424 92.103 29.6439 116.001 29.6439C139.898 29.6439 161.065 17.9424 174 0.000335693L232 41.1356ZM0.00103246 173.865C25.8735 137.981 68.2063 114.578 116.001 114.578C163.795 114.578 206.128 137.981 232.001 173.865L174 215C161.065 197.058 139.898 185.357 116.001 185.357C92.1033 185.357 70.9369 197.058 58.0013 215L0.00103246 173.865Z"/>
        <mask id="arcmask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="332" height="315"><use href="#arcs" fill="white" fill-rule="evenodd"/></mask>
      </defs>
      <!-- two identical arc pairs (outline = inner half of a 22 stroke, as in Figma); they turn ±67.5° into the rosette -->
      <g id="symA"><g id="symAi"><use href="#arcs" fill="none" stroke="currentColor" stroke-width="22" mask="url(#arcmask)"/></g></g>
      <g id="symB"><g id="symBi"><use href="#arcs" fill="none" stroke="currentColor" stroke-width="22" mask="url(#arcmask)"/></g></g>
    </svg>
    <div class="abs nw" id="annam"></div>
    <!-- frames 05–06: full photo, opened by a circle from the rosette's centre -->
    <div class="layer" id="pfull" style="z-index:40">
      <div class="photo" id="pfullimg" style="background-image:url(img_sb/hue.jpg)"></div>
      <div class="abs" id="az" style="left:0;top:0;width:100%;color:var(--paper)"></div>
    </div>
  </div>

  <!-- B · frame 07: Ẩ on the guide lines -->
  <div class="layer" id="B" style="z-index:2;background:var(--paper);display:none">
    <div id="glines"></div>
    <div class="abs nw" id="gA" style="font-size:797px;"></div>
    <div class="abs nw" id="gHook" style="font-size:797px;line-height:1;z-index:1"><span>Ẩ</span><span class="abs" style="left:0;top:0;color:var(--paper);-webkit-text-stroke:5px var(--paper)">Â</span></div>
    <div class="abs nw" id="gCirc" style="font-size:797px;line-height:1;z-index:2"></div>
  </div>

  <!-- C · frame 08: place names, roman / italic, drifting -->
  <div class="layer" id="Cn" style="z-index:3;background:var(--paper);display:none"></div>

  <!-- D · frame 09: Hà Nội market photo, AN NAM, styles -->
  <div class="layer" id="D" style="z-index:4;display:none">
    <div class="photo" id="dimg" style="background-image:url(img_sb/market.jpg)"></div>
    <div class="abs nw" id="dannam" style="color:var(--paper)"></div>
    <div class="abs" id="dinfo" style="left:0;width:100%;top:1096px;color:var(--paper);font-size:48px;text-align:center;"></div>
  </div>

  <!-- frame 04: the whole composition becomes a window onto the photo (lighten: ink → photo, paper stays) -->
  <div class="photo" id="pin" style="background-image:url(img_sb/hue_s04.jpg);mix-blend-mode:lighten;opacity:0;z-index:60;background-size:2013px 1270px;background-position:0 0"></div>
  <div class="hud" id="hud">
    <div id="h1" style="left:48px"></div>
    <div id="h2" style="left:1017px"></div>
    <div id="h3" style="right:48px"></div>
  </div>
</div>

<script>
const W = 2034, H = 1270, FPS = 30, DUR = 10;
const C = { paper:'#f3f3f1', ink:'#0e0e0e' };
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,p) => a + (b-a)*p;
const expoOut = p => p >= 1 ? 1 : 1 - Math.pow(2, -10*p);
const expoInOut = p => p<=0?0:p>=1?1: p<.5 ? Math.pow(2,20*p-10)/2 : (2-Math.pow(2,-20*p+10))/2;
const quartInOut = p => p<.5 ? 8*p*p*p*p : 1-Math.pow(-2*p+2,4)/2;
const cubicOut = p => 1 - Math.pow(1-p, 3);
function fv(el, w=400, x=0, s=0) {   // XHGT 0 = AnNam Serif
  el.style.fontVariationSettings = `"wght" ${w}, "XHGT" ${x}, "slnt" ${s}`; el.style.fontWeight = Math.round(w);
}

// ---------- kerned, masked words (each letter in its own mask, positioned by the font's own spacing + kerning)
function kernWord(host, text, opt={}) {
  host.innerHTML = '';
  const meas = document.createElement('span'); meas.className = 'meas'; meas.textContent = text; host.appendChild(meas);
  const padT = opt.padTop ?? .1, padB = opt.padBot ?? .08, padX = opt.padX ?? .14;
  const items = [];
  [...text].forEach((ch,i)=>{
    if (ch === ' ') { items.push(null); return; }
    const m = document.createElement('span'); m.className = 'm';
    m.style.padding = `${padT}em ${padX}em ${padB}em`; m.style.marginTop = `-${padT}em`;
    const s = document.createElement('span'); s.textContent = ch; m.appendChild(s); host.appendChild(m);
    items.push({m, s, i});
  });
  host.style.lineHeight = '.7';
  return { host, meas, items, padX };
}
function layoutWord(K) {
  const tn = K.meas.firstChild, r = document.createRange();
  const hostR = K.host.getBoundingClientRect();
  const sc = K.host.offsetWidth ? hostR.width / K.host.offsetWidth : 1;
  const fs = parseFloat(getComputedStyle(K.host).fontSize);
  K.items.forEach(it=>{ if (!it) return;
    r.setStart(tn, it.i); r.setEnd(tn, it.i+1);
    it.m.style.left = ((r.getBoundingClientRect().left - hostR.left) / sc - K.padX*fs) + 'px';
  });
  K.host.style.width = K.meas.offsetWidth + 'px'; K.host.style.height = K.meas.offsetHeight + 'px';
}
// in: from below (dir 1) or above (dir −1); out: leaves upwards
function slot(K, t, tin, tout=null, stagger=.03, dur=.4, dir=1) {
  K.items.forEach((it,j)=>{ if (!it) return;
    const a = expoOut(seg(t, tin + j*stagger, tin + j*stagger + dur));
    const b = tout == null ? 0 : expoInOut(seg(t, tout + j*stagger*.6, tout + j*stagger*.6 + dur*.8));
    it.s.style.transform = `translateY(${(dir*(1-a) - b)*190}%)`; });
}
// letters come forward out of the depth: far back, blurred, transparent → in place, sharp; out = recede back
function depth(K, t, tin, tout=null, stagger=.035, dur=.62) {
  const n = K.items.length;
  K.items.forEach((it,j)=>{ if (!it) return;
    const d = Math.abs(j - (n-1)/2) * stagger;                      // from the middle of the line outwards
    const a = expoOut(seg(t, tin + d, tin + d + dur));
    const b = tout == null ? 0 : Math.pow(seg(t, tout + d*.5, tout + d*.5 + .32), 1.6);
    const z = -900*(1-a) - 700*b, blur = 30*(1-a) + 26*b;
    it.s.style.transform = `perspective(1400px) translateZ(${z}px)`;
    it.s.style.filter = blur > .2 ? `blur(${blur.toFixed(1)}px)` : 'none';
    it.s.style.opacity = clamp(a*1.4) * (1 - b);
  });
}
const cx = document.createElement('canvas').getContext('2d');
function ink(text, size, weight=400, italic=false) {
  cx.font = `${italic?'italic ':''}${weight} ${size}px AN`; const m = cx.measureText(text);
  return { l:m.actualBoundingBoxLeft, r:m.actualBoundingBoxRight, a:m.actualBoundingBoxAscent, d:m.actualBoundingBoxDescent, w:m.width };
}

// ================= build =================
const imgs = ['img_sb/hue.jpg','img_sb/hue_s04.jpg','img_sb/market.jpg'].map(src=>new Promise(res=>{ const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
let HUD = [], KN, AZ = [], LZ = [], KA, NM = [], KD, DI = [];
function build() {
  // HUD (storyboard: cap 33.6 px at y 48)
  [['h1','BY ĐÌZAI STUDIO'],['h2','AN NAM SERIF'],['h3','TYPE SPECIMEN - 2026']].forEach(([id,txt])=>{ const K = kernWord($(id), txt, {padTop:.35}); fv(K.host); HUD.push(K); });
  // AN NAM: full width, cap top at y 823 (storyboard), sized so its ink spans 59 → 1988
  KN = kernWord($('annam'), 'AN NAM', {padTop:.12});
  const k = ink('AN NAM', 100); const fs = (1988 - 59) / ((k.l + k.r)/100);
  $('annam').style.fontSize = fs + 'px'; $('annam').dataset.inkl = k.l/100*fs;
  // A–Z and a–z blocks (4 centred lines, pitch 180, white)
  const up = ['ABCDEFG','HIJKLMNO','PQRSTUV','WXYZ'], lo = ['abcdefg','hijklmno','pqrstuv','wxyz'];
  [[up,AZ],[lo,LZ]].forEach(([rows,arr])=>rows.forEach((txt,i)=>{
    const d = document.createElement('div'); d.className='abs nw'; d.style.fontSize = '196px'; $('az').appendChild(d);
    const K = kernWord(d, txt, {padTop:.35, padBot:.3}); fv(d); K.items.forEach(it=>{ if (it) it.m.style.overflow = 'visible'; }); arr.push({K, i});
  }));
  // Ẩ on the guide lines (storyboard: 397 · 407 · 538 · 965 · 1127)
  [397, 407, 538, 965, 1127].forEach((y,i)=>{ const l = document.createElement('div'); l.className='abs';
    l.style.cssText = `left:0;top:${y}px;width:${W}px;height:1.5px;background:#c9c9c5;transform-origin:0 50%;`; $('glines').appendChild(l); });
  KA = kernWord($('gA'), 'A', {padTop:.05}); fv($('gA'));
  $('gCirc').textContent = 'Â'; fv($('gCirc')); fv($('gHook'));
  // place names (storyboard lines: pitch 228, roman / italic alternating)
  const names = [['Huế - Hội An - Hà Nội - Sài Gòn - Huế - Hội An - Hà Nội', false, -265],
                 ['Định Tường - Vĩnh Long - Định Tường - Vĩnh Long', true, 62],
                 ['Hoa Lư - Thăng Long - Hoa Lư - Thăng Long', false, 62],
                 ['Gia Định - Bến Thành - Gia Định - Bến Thành', true, 62],
                 ['Khánh Hội - Bình Định - Khánh Hội - Bình Định', false, 62]];
  names.forEach(([txt,it,x0],i)=>{
    const d = document.createElement('div'); d.className='abs nw';
    d.style.cssText = `font-size:212px;line-height:1.1;top:${155 + i*228 - 40}px;left:0;${it?'font-style:italic;':''}`;
    d.textContent = txt; fv(d); $('Cn').appendChild(d); NM.push({d, x0, dir: i%2 ? 1 : -1, i});
  });
  // frame 09
  KD = kernWord($('dannam'), 'AN NAM', {padTop:.12}); $('dannam').style.fontSize = $('annam').style.fontSize;
  const star = `<svg width="20" height="20" viewBox="0 0 20 20" style="display:inline-block;vertical-align:.12em;margin:0 12px"><path fill="currentColor" d="M7.33333 0H12.6667C12.4889 1.37778 12.2222 2.73333 11.8667 4.06667C11.5556 5.4 11.3333 6.68889 11.2 7.93333C12.2222 7.17778 13.2222 6.33333 14.2 5.4C15.1778 4.42222 16.2222 3.51111 17.3333 2.66667L20 7.33333C18.7556 7.86667 17.4667 8.33333 16.1333 8.73333C14.8 9.08889 13.5556 9.51111 12.4 10C13.5556 10.4889 14.8 10.9333 16.1333 11.3333C17.4667 11.6889 18.7556 12.1333 20 12.6667L17.3333 17.3333C16.2222 16.4889 15.1778 15.5778 14.2 14.6C13.2222 13.6222 12.2222 12.7778 11.2 12.0667C11.3333 13.3111 11.5556 14.6 11.8667 15.9333C12.2222 17.2667 12.4889 18.6222 12.6667 20H7.33333C7.51111 18.6222 7.75556 17.2667 8.06667 15.9333C8.42222 14.6 8.66667 13.3111 8.8 12.0667C7.82222 12.7778 6.82222 13.6222 5.8 14.6C4.82222 15.5778 3.77778 16.4889 2.66667 17.3333L0 12.6667C1.28889 12.1333 2.6 11.6889 3.93333 11.3333C5.26667 10.9333 6.48889 10.4889 7.6 10C6.48889 9.51111 5.26667 9.08889 3.93333 8.73333C2.6 8.33333 1.28889 7.86667 0 7.33333L2.66667 2.66667C3.77778 3.51111 4.82222 4.42222 5.8 5.4C6.82222 6.33333 7.82222 7.17778 8.8 7.93333C8.66667 6.68889 8.42222 5.4 8.06667 4.06667C7.75556 2.73333 7.51111 1.37778 7.33333 0Z"/></svg>`;
  ['VARIABLE', '<i>ITALIC</i>', `REGULAR${star}MEDIUM${star}SEMIBOLD${star}BOLD`].forEach((h,i)=>{
    const m = document.createElement('div'); m.style.cssText = `height:46px;overflow:hidden;line-height:34px;padding-top:2px;`;
    const s = document.createElement('div'); s.innerHTML = h; m.appendChild(s); $('dinfo').appendChild(m); DI.push(s);
  });
}

// ================= render(t) =================
function render(t) {
  const inA = t < 5.32, inB = t >= 4.98 && t < 6.75, inC = t >= 6.38 && t < 8.35, inD = t >= 7.92;
  $('A').style.display = inA ? 'block' : 'none'; $('B').style.display = inB ? 'block' : 'none';
  $('Cn').style.display = inC ? 'block' : 'none'; $('D').style.display = inD ? 'block' : 'none';

  // ---------- HUD (in at 0.3; colour follows what is under it)
  HUD.forEach((K,i)=>{ layoutWord(K); slot(K, t, .32 + i*.08, null, .018, .4); });
  $('h2').style.transform = `translateX(-50%)`;
  const white = (t >= 3.3 && t < 5.12) || t >= 8.12;
  $('hud').style.color = white ? C.paper : C.ink;
  $('hud').style.zIndex = (t >= 2.3 && t < 3.3) ? 30 : 50;   // under the lighten photo while the letters are windows

  // ---------- A: frames 02–06
  if (inA) {
    // symbol: arcs slide in from top / bottom, then the two pairs turn ±67.5° into the rosette (frame 03)
    const sIn = expoOut(seg(t, .45, .95));
    const rot = expoInOut(seg(t, 1.6, 2.15)) * 67.5;
    $('symAi').setAttribute('transform', `rotate(${rot} 116 107.5)`);
    $('symBi').setAttribute('transform', `rotate(${-rot} 116 107.5)`);
    $('sym').style.opacity = sIn; $('sym').style.transform = `scale(${lerp(.6, 1, sIn)}) rotate(${lerp(-30, 0, sIn)}deg)`;
    $('sym').style.color = C.ink;
    // AN NAM: kerned letters rise into place, cap top at y 823
    const an = $('annam'); fv(an); layoutWord(KN);
    an.style.left = (59 - +an.dataset.inkl) + 'px'; an.style.top = '823px';
    slot(KN, t, .55, null, .06, .55);
    // frame 04: ink becomes a window onto the photo
    const pin = $('pin');
    pin.style.opacity = expoOut(seg(t, 2.4, 2.8)) * (1 - expoOut(seg(t, 3.28, 3.44)));
    pin.style.transform = `scale(${lerp(1.06, 1.0, seg(t, 2.4, 3.3))})`;
    // frame 05: photo opens as a circle from the rosette's centre
    const r = expoInOut(seg(t, 3.08, 3.5)) * 2400;
    $('pfull').style.clipPath = `circle(${r}px at 1017px 452px)`;
    $('pfull').style.display = t >= 3.08 ? 'block' : 'none';
    $('pfullimg').style.transform = `scale(${lerp(1.12, 1.0, expoOut(seg(t, 3.08, 5.1)))})`;
    // A–Z rows rise in (05), each row rolls over to lower case (06)
    AZ.forEach(({K,i})=>{ fv(K.host); layoutWord(K);
      K.host.style.left = (W - K.host.offsetWidth)/2 + 'px'; K.host.style.top = (300 + i*180) + 'px';
      depth(K, t, 3.36 + i*.06, 4.1 + i*.04); });
    LZ.forEach(({K,i})=>{ fv(K.host); layoutWord(K);
      K.host.style.left = (W - K.host.offsetWidth)/2 + 'px'; K.host.style.top = (300 + i*180) + 'px';
      depth(K, t, 4.3 + i*.06, null); });
  }

  // ---------- B: frame 07 — paper rises over the photo; lines draw; A, then ^, then the hook land
  if (inB) {
    const b = $('B');
    b.style.clipPath = `inset(${(1 - expoInOut(seg(t, 5.0, 5.3)))*100}% 0 0 0)`;
    b.style.transform = `translateY(${-expoInOut(seg(t, 6.4, 6.72))*H}px)`;
    [...$('glines').children].forEach((l,i)=>{ l.style.transform = `scaleX(${quartInOut(seg(t, 5.12 + i*.05, 5.6 + i*.05))})`; });
    const fs = 797, base = 965, k = ink('A', fs);
    const A = $('gA'); layoutWord(KA);
    A.style.left = (1017 - (k.r - k.l)/2 - k.l) + 'px';
    A.style.top = (base - .71*fs) + 'px';
    slot(KA, t, 5.3, null, 0, .45);
    // marks: same glyph positions as Ẩ, shown only above the cap line
    const kh = ink('Ẩ', fs), kc = ink('Â', fs);
    [['gCirc','Â',5.62,kc],['gHook','Ẩ',5.86,kh]].forEach(([id,ch,t0,kk])=>{
      const e = $(id); e.style.left = A.style.left; e.style.top = (base - .86*fs) + 'px';
      const capTop = base - .7*fs - 8;               // keep only what sits above the cap
      const localTop = capTop - (base - .86*fs);
      e.style.clipPath = `inset(-400px -400px ${fs - localTop}px -400px)`;
      const p = expoOut(seg(t, t0, t0 + .32));
      e.style.transform = `translateY(${-(1-p)*220}px)`; e.style.opacity = clamp(p*3);
    });
  }

  // ---------- C: frame 08 — names push up from below and drift (alternate directions)
  if (inC) {
    const c = $('Cn');
    c.style.transform = `translateY(${(1 - expoInOut(seg(t, 6.4, 6.72)))*H}px)`;
    NM.forEach(({d,x0,dir,i})=>{ d.style.transform = `translateX(${x0 + dir*(t - 7.2)*110}px)`; });
  }

  // ---------- D: frame 09 — the market photo opens like a shutter from the middle; AN NAM drops in
  if (inD) {
    const o = expoInOut(seg(t, 7.94, 8.32));
    $('D').style.clipPath = `inset(${(1-o)*50}% 0 ${(1-o)*50}% 0)`;
    $('dimg').style.transform = `scale(${lerp(1.14, 1.0, cubicOut(seg(t, 7.94, 10)))})`;
    const dn = $('dannam'); fv(dn); layoutWord(KD);
    dn.style.left = $('annam').style.left || (59 - +$('annam').dataset.inkl) + 'px'; dn.style.top = '146px';
    slot(KD, t, 8.22, null, .06, .55, -1);
    DI.forEach((s,i)=>{ const p = expoOut(seg(t, 8.6 + i*.1, 9.05 + i*.1)); s.style.transform = `translateY(${(1-p)*110}%)`; });
  }
}

window.ready = (async () => {
  for (const f of ['400 100px AN','italic 400 100px AN'])
    await document.fonts.load(f, 'AN NAM ĐÌZAI Ẩ Huế Hội Định Tường Vĩnh Lư Thăng Bến Thành Khánh Bình abcdefg');
  await Promise.all(imgs); await document.fonts.ready;
  build(); render(0);
  return true;
})();
window.render = render; window.DUR = DUR; window.FPS = FPS;
if (location.search.includes('play')) window.ready.then(()=>{ const t0 = performance.now(); const loop = () => { render(((performance.now()-t0)/1000) % DUR); requestAnimationFrame(loop); }; loop(); });
</script>
</body>
</html>
